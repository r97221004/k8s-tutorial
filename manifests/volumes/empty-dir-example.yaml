apiVersion: v1
kind: Pod
metadata:
  name: empty-dir-example
spec:
  containers:
    - name: empty-dir-writer
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        limits:
          memory: 128Mi
          cpu: 500m
      volumeMounts:
        - name: temporary-storage
          mountPath: /usr/share/temp
    - name: empty-dir-reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        limits:
          memory: 128Mi
          cpu: 500m
      volumeMounts:
        - name: temporary-storage
          mountPath: /temp
          readOnly: true # this container can read the files, but not change them
  volumes:
    - name: temporary-storage
      emptyDir:
        sizeLimit: 100Mi

