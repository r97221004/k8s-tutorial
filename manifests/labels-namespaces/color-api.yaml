apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-api
  labels:
    app: color-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: color-api
  template:
    metadata:
      labels:
        app: color-api
    spec:
      containers:
        - name: color-api
          image: <YOUR_DOCKERHUB_USER>/color-api:1.2.0
          env:
            - name: COLOR
              value: "<COLOR>"           # a different color per environment
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: color-api
  labels:
    app: color-api
spec:
  selector:
    app: color-api
  ports:
    - port: 80
      targetPort: 8080
