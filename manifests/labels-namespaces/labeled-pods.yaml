# Five Pods for practicing selectors. The labels are the point;
# every Pod runs plain nginx.
apiVersion: v1
kind: Pod
metadata:
  name: color-api-frontend
  labels:
    app: color-api
    environment: dev
    tier: frontend
    release: stable
spec:
  containers:
    - name: nginx
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: color-api-backend
  labels:
    app: color-api
    environment: dev
    tier: backend
    release: stable
spec:
  containers:
    - name: nginx
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: color-api-canary
  labels:
    app: color-api
    environment: dev
    tier: backend
    release: canary
spec:
  containers:
    - name: nginx
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: ecomm-dev
  labels:
    app: ecomm
    environment: dev
    tier: backend
    release: stable
spec:
  containers:
    - name: nginx
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: ecomm-prod
  labels:
    app: ecomm
    environment: prod
    tier: backend
    release: stable
spec:
  containers:
    - name: nginx
      image: nginx:1.27
