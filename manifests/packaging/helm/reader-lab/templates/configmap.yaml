{{- if .Values.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reader-lab.fullname" . }}
  labels:
    {{- include "reader-lab.labels" (dict "root" . "extra" .Values.extraLabels) | nindent 4 }}
data:
  {{- range $key, $value := .Values.config.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
