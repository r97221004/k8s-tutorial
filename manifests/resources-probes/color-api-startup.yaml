apiVersion: v1
kind: Pod
metadata:
  name: color-api-startup
  labels:
    app: color-api
spec:
  containers:
    - name: color-api
      image: <YOUR_DOCKERHUB_USER>/color-api:1.3.0
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
        - name: DELAY_STARTUP
          value: "false"
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        # periodSeconds × failureThreshold is how long the app gets to start
        periodSeconds: 3
        failureThreshold: 2
