apiVersion: v1
kind: Pod
metadata:
  name: heavy-api
  labels:
    app: heavy-api
spec:
  containers:
    - name: heavy-api
      image: <YOUR_DOCKERHUB_USER>/color-api:1.2.0
      resources:
        requests:
          cpu: "1"                 # a whole core: all of dev's quota
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      ports:
        - containerPort: 8080
