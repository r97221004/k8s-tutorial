apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
spec:
  containers:
    - name: memory-hog
      image: busybox:1.36
      command: ["sh", "-c", "tail /dev/zero"]   # keeps reading, and never lets go of memory
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
