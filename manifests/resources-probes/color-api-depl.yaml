apiVersion: apps/v1
kind: Deployment
metadata:
  name: color-api
  labels:
    app: color-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: color-api
  template:
    metadata:
      labels:
        app: color-api
    spec:
      containers:
        - name: color-api
          image: <YOUR_DOCKERHUB_USER>/color-api:1.1.0
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m                # 4 × 500m = 2: all of dev's limits.cpu
              memory: 512Mi
          ports:
            - containerPort: 8080
