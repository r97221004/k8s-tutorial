apiVersion: v1
kind: Pod
metadata:
  name: color-api-liveness
  labels:
    app: color-api
spec:
  containers:
    - name: color-api
      image: <YOUR_DOCKERHUB_USER>/color-api:1.3.0
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      env:
        - name: FAIL_LIVENESS
          value: "true"
      # /health fails on purpose here, so startup only checks that the app is listening
      startupProbe:
        tcpSocket:
          port: 8080
        periodSeconds: 3
        failureThreshold: 2
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        failureThreshold: 3
